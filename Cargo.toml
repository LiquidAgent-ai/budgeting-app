[package]
name = "anchored"
version = "1.1.0"
edition = "2021"
description = "Local personal finance — encrypted SQLite, read-only bank linking"
license = "MIT"
publish = false

[dependencies]
axum = { version = "0.8", features = ["form", "macros"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
once_cell = "1"

[target.'cfg(windows)'.dependencies]
tao = "0.34"
wry = "0.53"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
