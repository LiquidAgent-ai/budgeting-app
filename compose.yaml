# Compose Specification. `docker compose` and `podman compose` both use this file.
# No Swarm settings, no Docker socket, no privileged mode, no host network.
name: anchored

services:
  anchored:
    build:
      context: .
      dockerfile: Dockerfile
    image: anchored:latest
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_KEY: ${DATABASE_KEY:?Set DATABASE_KEY to a long random string}
      DATABASE_PATH: /data/anchored.db
      PORT: "3000"
      PUID: ${PUID:-568}
      PGID: ${PGID:-568}
      APP_URL: ${APP_URL:-}
      PLAID_CLIENT_ID: ${PLAID_CLIENT_ID:-}
      PLAID_SECRET: ${PLAID_SECRET:-}
      PLAID_ENV: ${PLAID_ENV:-sandbox}
    volumes:
      - ${ANCHORED_DATA:-anchored-data}:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://127.0.0.1:3000/api/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  anchored-data:
